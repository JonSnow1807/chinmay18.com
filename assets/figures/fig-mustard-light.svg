E2" opacity="1"/><text x="610.0" y="139.0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#192438" text-anchor="middle">Redis</text><text x="610.0" y="157.0" font-family="'Courier New', monospace" font-size="12" font-weight="400" fill="#52617A" text-anchor="middle">atomic Lua</text><path d="M 448 138 L 546 138 M 540.7 140.9 L 546 138 L 540.7 135.1" fill="none" stroke="#52617A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><text x="160" y="50" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#52617A">clock offset θ over the socket ack (NTP-style)</text><text x="160" y="240" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#52617A">each client: drift = player time − expected time, corrected by</text><text x="160" y="256" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#52617A">predictive rate control; seeks only for gross error</text><text x="548" y="92" font-family="'Courier New', monospace" font-size="11" font-weight="400" fill="#52617A">ordered epochs</text><text x="548" y="192" font-family="'Courier New', monospace" font-size="11" font-weight="400" fill="#52617A">idempotency keys</text><circle cx="304" cy="190" r="3" fill="#865900" opacity="1"/><text x="313" y="194" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#52617A">protocol model-checked with TLA+/TLC</text><path d="M28 278 L672 278" fill="none" stroke="#CCD5E2" stroke-width="1" opacity="1"/><text x="28" y="306" font-family="'Courier New', monospace" font-size="11" font-weight="400" fill="#5D6F88" letter-spacing="1.8">WHAT WAS MEASURED</text><text x="28" y="330" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#192438">Steady-state P95 drift by network scenario</text><path d="M232 342 L232 452" fill="none" stroke="#CCD5E2" stroke-width="1" opacity="1"/><text x="224" y="357" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#52617A" text-anchor="end">clean loopback</text><path d="M 232 346 H 303.9 Q 307.9 346 307.9 350 V 356 Q 307.9 360 303.9 360 H 232 Z" fill="#CCD5E2" opacity="0.9"/><text x="313.95" y="357" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#192438">49 ms</text><text x="224" y="378" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#192438" text-anchor="end">+150 ms each way (~300 ms RTT)</text><path d="M 232 367 H 302.4 Q 306.4 367 306.4 371 V 377 Q 306.4 381 302.4 381 H 232 Z" fill="#865900" opacity="1"/><text x="312.4" y="378" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#192438">48 ms</text><text x="224" y="399" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#52617A" text-anchor="end">50 ± 30 ms jitter</text><path d="M 232 388 H 350.4 Q 354.4 388 354.4 392 V 398 Q 354.4 402 350.4 402 H 232 Z" fill="#CCD5E2" opacity="0.9"/><text x="360.45" y="399" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#192438">79 ms</text><text x="224" y="420" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#52617A" text-anchor="end">25 ms + 5 % packet loss</text><path d="M 232 409 H 272.9 Q 276.9 409 276.9 413 V 419 Q 276.9 423 272.9 423 H 232 Z" fill="#CCD5E2" opacity="0.9"/><text x="282.95" y="420" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#192438">29 ms</text><text x="224" y="441" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#52617A" text-anchor="end">asymmetric 120 / 20 ms</text><path d="M 232 430 H 361.3 Q 365.3 430 365.3 434 V 440 Q 365.3 444 361.3 444 H 232 Z" fill="#CCD5E2" opacity="0.9"/><text x="371.3" y="441" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#192438">86 ms</text><text x="28" y="474" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#5D6F88">3 Chrome clients · 240 s · player-reported drift · predictive servo (shipped default) · docs/SYNC_DESIGN.md §8</text><text x="452" y="330" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#192438">Relay memory per connection</text><text x="492" y="361" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#192438" text-anchor="end">Rust</text><path d="M 500 350 H 545.3 Q 549.3 350 549.3 354 V 360 Q 549.3 364 545.3 364 H 500 Z" fill="#865900" opacity="1"/><text x="555.3" y="361" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#192438">14.5 KB</text><text x="492" y="387" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#52617A" text-anchor="end">Go</text><path d="M 500 376 H 632.0 Q 636.0 376 636.0 380 V 386 Q 636.0 390 632.0 390 H 500 Z" fill="#CCD5E2" opacity="0.9"/><text x="642.0" y="387" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#192438">40 KB</text><text x="452" y="420" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#5D6F88">local 10,000-connection test</text><text x="452" y="436" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#5D6F88">study relays, not the production backend;</text><text x="452" y="452" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#5D6F88">extreme-tail latency comparison inconclusive</text>
