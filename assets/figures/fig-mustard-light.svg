<svg xmlns="http://www.w3.org/2000/svg" width="700" height="496" viewBox="0 0 700 496" role="img" aria-labelledby="title">
<title id="title">Mustard: clients estimate a clock offset over the socket ack and correct drift with predictive rate control; room state lives in Redis behind atomic Lua scripts. Chart: steady-state P95 drift 49, 48, 79, 29 and 86 ms across five network scenarios; relay memory 14.5 KB (Rust) versus 40 KB (Go) per connection.</title>
