, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#192438">3.84×</text><text x="160" y="415" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#192438" text-anchor="end">Transformer 6L</text><path d="M 168 404 H 576.3 Q 580.3 404 580.3 408 V 414 Q 580.3 418 576.3 418 H 168 Z" fill="#6540B4" opacity="1"/><text x="586.3" y="415" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#192438">6.65×</text><path d="M 168 425 H 322.1 Q 326.1 425 326.1 429 V 435 Q 326.1 439 322.1 439 H 168 Z" fill="#CCD5E2" opacity="0.9"/><text x="332.1" y="436" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#52617A">2.55× vs eager with TF32 matmuls enabled</text><rect x="28" y="462" width="12" height="12" rx="3" fill="#6540B4" opacity="1"/><text x="46" y="472" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#52617A">vs PyTorch-default fp32 eager baseline</text><rect x="300" y="462" width="12" height="12" rx="3" fill="#CCD5E2" opacity="0.9"/><text x="318" y="472" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#52617A">vs an informed eager baseline (TF32 matmuls on)</text><text x="28" y="494" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#5D6F88">NVIDIA A100-SXM4-40GB · full training step: forward + loss + backward + optimizer</text><text x="28" y="510" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#5D6F88">winning configs use torch.compile together with precision, memory-format and fused-optimizer choices</text>
