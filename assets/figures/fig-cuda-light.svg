<svg xmlns="http://www.w3.org/2000/svg" width="700" height="524" viewBox="0 0 700 524" role="img" aria-labelledby="title">
<title id="title">Fused CUDA operators: the eager composite runs residual-add, normalization and an FP8 cast as three kernels with HBM round-trips; the fused version does all three in one kernel. Chart: dynamic RMSNorm to FP8 kernel time is 4.9 to 7.2 times faster than the eager composite and 1.04 to 1.76 times faster than the compiled composite across six shapes on an A100 in FP16.</title>
<defs></defs>
<rect x="1" y="1" width="698" height="522" rx="16" fill="#F6F8FC" stroke="#CCD5E2" opacity="1"/><text x="28" y="34" font-family="'Courier New', monospace" font-size="11" font-weight="400" fill="#5D6F88" letter-spacing="1.8">HOW IT WORKS</text><text x="28" y="62" font-family="'Courier New', monospace" font-size="11" font-weight="400" fill="#52617A" letter-spacing="1.4">EAGER COMPOSITE</text><rect x="28" y="72" width="150" height="42" rx="9" fill="#EDF1F7" stroke="#CCD5E2" opacity="1"/><text x="103.0" y="98.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#192438" text-anchor="middle">x + residual</text><rect x="262" y="72" width="176" height="42" rx="9" fill="#EDF1F7" stroke="#CCD5E2" opacity="1"/><text x="350.0" y="98.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#192438" text-anchor="middle">LayerNorm / RMSNorm</text><rect x="522" y="72" width="150" height="42" rx="9" fill="#EDF1F7" stroke="#CCD5E2" opacity="1"/><text x="597.0" y="98.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#192438" text-anchor="middle">cast → FP8</text><path d="M 178 93 L 262 93 M 256.7 95.9 L 262 93 L 256.7 90.1" fill="none" stroke="#52617A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><text x="220.0" y="87" font-family="'Courier New', monospace" font-size="10" font-weight="400" fill="#5D6F88" text-anchor="middle">HBM</text><path d="M 438 93 L 522 93 M 516.7 95.9 L 522 93 L 516.7 90.1" fill="none" stroke="#52617A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><text x="480.0" y="87" font-family="'Courier New', monospace" font-size="10" font-weight="400" fill="#5D6F88" text-anchor="middle">HBM</text><text x="28" y="136" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#52617A">three launches; the hidden state round-trips through HBM between them</text><text x="28" y="174" font-family="'Courier New', monospace" font-size="11" font-weight="400" fill="#52617A" letter-spacing="1.4">FUSED</text><rect x="28" y="184" width="410" height="56" rx="9" fill="#EDF1F7" stroke="#116B64" opacity="1"/><text x="233.0" y="213.0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#192438" text-anchor="middle">residual-add + norm + FP8 quantize</text><text x="233.0" y="231.0" font-family="'Courier New', monospace" font-size="12" font-weight="400" fill="#52617A" text-anchor="middle">one kernel · one read of x and residual</text><path d="M 438 204 L 522 204 M 516.7 206.9 L 522 204 L 516.7 201.1" fill="none" stroke="#52617A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><path d="M 438 220 L 522 236 M 516.3 237.8 L 522 236 L 517.4 232.2" fill="none" stroke="#52617A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><rect x="522" y="190" width="150" height="28" rx="9" fill="#EDF1F7" stroke="#CCD5E2" opacity="1"/><text x="597.0" y="209.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#192438" text-anchor="middle">fp8 out + scale</text><rect x="522" y="224" width="150" height="28" rx="9" fill="#EDF1F7" stroke="#CCD5E2" opacity="1"/><text x="597.0" y="243.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#192438" text-anchor="middle">new residual</text><circle cx="34" cy="270" r="3" fill="#116B64" opacity="1"/><text x="43" y="274" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#52617A">backward: fixed-chunk partials → fixed-order finalize, no atomics</text><circle cx="34" cy="292" r="3" fill="#116B64" opacity="1"/><text x="43" y="296" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#52617A">torch.compile traces each op as one custom-op node: zero graph breaks</text><path d="M28 318 L672 318" fill="none" stroke="#CCD5E2" stroke-width="1" opacity="1"/><text x="28" y="346" font-family="'Courier New', monospace" font-size="11" font-weight="400" fill="#5D6F88" letter-spacing="1.8">WHAT WAS MEASURED</text><text x="28" y="370" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#192438">Dynamic RMSNorm → FP8: kernel-time speedup, min–max across six shapes</text><path d="M236 384 L236 456" fill="none" stroke="#CCD5E2" stroke-width="1" opacity="1"/><path d="M288 384 L288 456" fill="none" stroke="#5D6F88" stroke-width="1" opacity="1"/><text x="288" y="470" font-family="'Courier New', monospace" font-size="10" font-weight="400" fill="#5D6F88" text-anchor="middle">1× parity</text><text x="228" y="403" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#52617A" text-anchor="end">vs eager PyTorch composite</text><rect x="490.8" y="392" width="119.6" height="14" rx="7.0" fill="#CCD5E2"/><text x="484.8" y="403" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#192438" text-anchor="end">4.9×</text><text x="616.4000000000001" y="403" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#192438">7.2×</text><text x="228" y="433" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#192438" text-anchor="end">vs torch.compile’d composite</text><rect x="290.1" y="422" width="37.4" height="14" rx="7.0" fill="#116B64"/><text x="284.08" y="433" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#192438" text-anchor="end">1.04×</text><text x="333.52" y="433" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#192438">1.76×</text><text x="28" y="488" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#5D6F88">NVIDIA A100 · FP16 · six shapes, 512×1024 … 4096×8192 · kernel time, not end-to-end model speed</text><text x="28" y="504" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#5D6F88">H100 results and the configurations where PyTorch wins are documented in the repository</text>
</svg>
